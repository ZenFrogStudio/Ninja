[package]
name = "wm"
version = "0.0.0"
description = "Core window management logic for Ninja."
repository = ""
license = "GPL-3.0-only"
edition = "2021"

# No binary target: `ninja` is built from the merged app in
# `bar/packages/desktop`, which hosts this crate alongside the bar. Keeping
# a `ninja` bin here too would collide on the output filename.
[lib]
path = "src/lib.rs"

[features]
ui_access = []

[build-dependencies]

[dependencies]
anyhow = { workspace = true }
ambassador = "0.4"
clap = { workspace = true }
enum-as-inner = "0.6"
home = { workspace = true }
image = "0.25"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
shell-util = { path = "../../bar/crates/shell-util" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { workspace = true }
tray-icon = "0.21"
uuid = { workspace = true }
wm-cli = { path = "../wm-cli" }
wm-common = { path = "../wm-common" }
wm-ipc-client = { path = "../wm-ipc-client" }
wm-macros = { workspace = true }
wm-platform = { path = "../wm-platform" }

[dev-dependencies]
bon = "3"
wm-platform = { path = "../wm-platform", features = ["test_utils"] }

[lints]
workspace = true
