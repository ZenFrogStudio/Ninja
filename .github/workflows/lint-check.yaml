name: Lint check

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # MacOS (Apple Silicon)
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Windows (x64)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
          # Version comes from rust-toolchain.toml.

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: ${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting (rustfmt)
        run: cargo fmt --check

      # The bar embeds the client API bundle via `include_str!`, so the
      # frontend has to be built before anything that compiles `ninja`.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build client API
        working-directory: bar
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ninja build

      - name: Test client API
        working-directory: bar
        run: pnpm --filter ninja test

      # Clippy itself runs `cargo check`, so this also catches compile errors.
      # Warnings are fatal for the WM crates and the bar alike.
      - name: Check linting (clippy)
        run: >
          cargo clippy
          -p wm -p wm-cli -p wm-common -p wm-ipc-client
          -p wm-macros -p wm-platform -p wm-watcher -p ninja
          --all-targets --all-features -- -D warnings

      # `wm-watcher` is Windows-only, so it's excluded from the macOS run.
      - name: Run tests
        env:
          SCOPE: ${{ matrix.platform != 'windows-latest' && '--exclude wm-watcher' || '' }}
        shell: bash
        run: cargo test --workspace --locked $SCOPE
